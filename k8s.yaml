apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cict-data
  namespace: cict
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cict
  namespace: cict
  labels:
    app: cict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cict
  template:
    metadata:
      labels:
        app: cict
    spec:
      nodeName: z4g4                # image is loaded in z4g4's containerd
      containers:
        - name: cict
          image: docker.io/library/cict:latest
          imagePullPolicy: Never    # local image, don't try to pull
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data      # SQLite db lives here, survives restarts
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cict-data
---
apiVersion: v1
kind: Service
metadata:
  name: cict
  namespace: cict
spec:
  type: NodePort
  selector:
    app: cict
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      name: http