{{define "content"}}
<div class="page-header">
    <h1>{{if .Ingredient}}Edit Ingredient{{else}}Add Ingredient{{end}}</h1>
    <p class="page-subtitle">For: <a href="/inventory/{{.ItemID}}">{{.ItemName}}</a> ({{.ItemUnit}})</p>
</div>

<div class="card">
    <form action="/inventory/{{.ItemID}}/ingredients{{if .Ingredient}}/{{.Ingredient.ID}}{{end}}" method="post">
        {{if .Ingredient}}<input type="hidden" name="_method" value="PUT">{{end}}

        <label for="name">Ingredient / material name</label>
        <input type="text" id="name" name="name" value="{{if .Ingredient}}{{.Ingredient.Name}}{{end}}" placeholder="e.g. chili peppers" required>

        <label for="unit">Ingredient unit</label>
        <input type="text" id="unit" name="unit" value="{{if .Ingredient}}{{.Ingredient.Unit}}{{end}}" placeholder="oz, g, ml, kg, L, each…" required>

        <label for="cost_per_unit">Cost per ingredient unit <span class="hint">($)</span></label>
        <input type="number" id="cost_per_unit" name="cost_per_unit" min="0" step="0.001" value="{{if .Ingredient}}{{printf "%.3f" .Ingredient.CostPerUnit}}{{else}}0{{end}}" placeholder="4.00" required>

        <label for="quantity_per_bottle">Quantity per <strong class="output-unit">{{.ItemUnit}}</strong></label>
        <input type="number" id="quantity_per_bottle" name="quantity_per_bottle" min="0" step="0.001" value="{{if .Ingredient}}{{printf "%.3f" .Ingredient.QuantityPerBottle}}{{else}}0{{end}}" placeholder="0.5" required>

        <p class="hint preview" id="cost-preview" hidden>Estimated cost per {{.ItemUnit}}: <strong>$0.00</strong></p>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{if .Ingredient}}Save Changes{{else}}Add Ingredient{{end}}</button>
            <a href="/inventory/{{.ItemID}}" class="btn">Cancel</a>
        </div>
    </form>
</div>

<script>
    // progressive enhancement: live preview of cost per {{.ItemUnit}}.
    // without JS, the form still works — the computed cost appears on the item detail page after submit.
    (function () {
        var cost = document.getElementById('cost_per_unit');
        var qty  = document.getElementById('quantity_per_bottle');
        var prev = document.getElementById('cost-preview');
        if (!cost || !qty || !prev) return;
        function update() {
            var c = parseFloat(cost.value) || 0;
            var q = parseFloat(qty.value)  || 0;
            if (c > 0 && q > 0) {
                prev.hidden = false;
                prev.querySelector('strong').textContent = '$' + (c * q).toFixed(4);
            } else {
                prev.hidden = true;
            }
        }
        cost.addEventListener('input', update);
        qty.addEventListener('input', update);
        update();
    })();
</script>
{{end}}
