{{define "content"}}
<h1>Record a Sale</h1>
<form action="/sales" method="post">
    <label for="inventory_item_id">Item</label>
    <select id="inventory_item_id" name="inventory_item_id" required>
        <option value="">— Select an item —</option>
        {{range .Items}}
        <option value="{{.ID}}">{{.Name}} ({{.QuantityOnHand}} on hand)</option>
        {{end}}
    </select>

    <label for="quantity">Quantity Sold</label>
    <input type="number" id="quantity" name="quantity" min="1" step="1" value="1" required>

    <label for="sale_price">Sale Price Per Unit ($)</label>
    <input type="number" id="sale_price" name="sale_price" min="0" step="0.01" value="0" required>

    <label for="sale_date">Sale Date</label>
    <input type="date" id="sale_date" name="sale_date" value="{{.Today}}" required>

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="2"></textarea>

    <button type="submit" class="btn btn-primary">Record Sale</button>
    <a href="/sales" class="btn">Cancel</a>
</form>
{{end}}
