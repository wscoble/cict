{{define "content"}}
<div class="page-header">
    <h1>{{if .Item}}Edit Item{{else}}New Inventory Item{{end}}</h1>
</div>

<div class="card">
    <form action="{{if .Item}}/inventory/{{.Item.ID}}{{else}}/inventory{{end}}" method="post">
        {{if .Item}}<input type="hidden" name="_method" value="PUT">{{end}}
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{if .Item}}{{.Item.Name}}{{end}}" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2">{{if .Item}}{{.Item.Description}}{{end}}</textarea>

        <label for="unit">Unit</label>
        <input type="text" id="unit" name="unit" value="{{if .Item}}{{.Item.Unit}}{{else}}bottle{{end}}" required>

        <label for="quantity_on_hand">Quantity On Hand</label>
        <input type="number" id="quantity_on_hand" name="quantity_on_hand" min="0" step="1" value="{{if .Item}}{{.Item.QuantityOnHand}}{{else}}0{{end}}" required>

        <label for="selling_price">Selling Price ($)</label>
        <input type="number" id="selling_price" name="selling_price" min="0" step="0.01" value="{{if .Item}}{{printf "%.2f" .Item.SellingPrice}}{{else}}0{{end}}" required>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{if .Item}}Save Changes{{else}}Create Item{{end}}</button>
            <a href="/inventory" class="btn">Cancel</a>
        </div>
    </form>
</div>
{{end}}
